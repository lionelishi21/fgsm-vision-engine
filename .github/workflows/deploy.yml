name: Deploy FGSM Vision Engine to EC2

# Disabled by default in practice: FGSM_ENABLED is not set on the Node
# backend, so nothing calls this service even once it's deployed and
# running. See src/inference.py for why - the model hasn't been validated
# on real match footage yet, only on its own clean training clips.
on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  900s
          script: |
            set -e
            APP_DIR=/home/ubuntu/fgsm-vision-engine

            # 1. Clone or update the repo
            if [ -d "$APP_DIR/.git" ]; then
              echo "→ Updating existing checkout..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
            else
              echo "→ Cloning fresh..."
              git clone https://github.com/lionelishi21/fgsm-vision-engine.git "$APP_DIR"
              cd "$APP_DIR"
            fi
            echo "→ Now on commit: $(git log -1 --oneline)"

            # 2. System deps (idempotent, cheap if already installed)
            sudo apt-get update -y -qq
            sudo apt-get install -y -qq python3 python3-venv python3-pip

            # 3. Python venv + deps
            python3 -m venv .venv
            source .venv/bin/activate
            pip install -q --upgrade pip
            pip install -q -r requirements.txt

            # 4. Sync the trained model from S3 (read-only creds, same ones
            # already used by the Node backend's analysis pipeline)
            pip install -q awscli
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            AWS_DEFAULT_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}" \
              ./scripts/fetch_model.sh || echo "⚠️  Model sync failed - service will boot with model_loaded=false"

            # 5. Start/reload via PM2 (disabled by default: FGSM_ENABLED is
            # not set on the Node backend, so nothing calls this yet).
            # Delete-then-start instead of restart, since restart doesn't
            # pick up code/env changes as reliably on a Python process.
            pm2 delete fgsm-vision 2>/dev/null || true
            pm2 start ".venv/bin/uvicorn" --name fgsm-vision --interpreter none \
              --cwd "$APP_DIR" \
              -- src.api:app --host 0.0.0.0 --port 8000
            pm2 save

            # 6. Health check
            sleep 8
            curl -sf http://localhost:8000/health && echo "✅ FGSM vision engine UP" || echo "❌ Health check failed"

      - name: Notify success
        if: success()
        run: echo "✅ FGSM vision engine deployed (still gated off by FGSM_ENABLED on the Node side)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed — check EC2 logs"
